idempotency:
  coverage: none
  supported: false
  header: null
  scope: []
  evidence: >-
    The OpenAPI declares no Idempotency-Key (or equivalent) header on any operation, and the published
    reference at https://www.workstyleos.com/publicapi/index.html documents no replay-protection mechanism.
    Three of the thirteen operations mutate state (postSpotReservation, putSpotReservation,
    deleteSpotReservation) and none of them can be safely retried by a client that did not observe the
    response.
  cross_reference: openapi/acall-public-api-openapi.yml
reversibility:
  grade: documented
  note: >-
    The one write surface, spot (workspace) reservations, ships a full CRUD triangle: a reservation created
    with postSpotReservation can be amended with putSpotReservation or removed with deleteSpotReservation.
    No time window, cut-off, or retention period for the reversal is stated anywhere in the reference or the
    help centre, so this grades as documented rather than verified — an agent can undo a reservation but
    cannot know from the published contract until when.
  write_surfaces:
  - operation: postSpotReservation
    method: POST
    path: /spot_reservations/
    reversal: deleteSpotReservation
    reversal_kind: delete
    window: null
    window_source: null
    constraint: >-
      Stated in the operation summary of deleteSpotReservation — 複数スポットに紐づく予約データは削除不可
      ("reservation data linked to multiple spots cannot be deleted"). A reservation spanning more than one
      spot is therefore NOT reversible through this API.
  - operation: putSpotReservation
    method: PATCH
    path: /spot_reservations/{spot_reservation_id}
    reversal: putSpotReservation
    reversal_kind: re-update
    window: null
    window_source: null
    constraint: >-
      An update is reversed only by issuing a further update; the API returns no prior-state snapshot, so a
      caller must capture the reservation with getSpotReservation before mutating it if it wants to restore.
  - operation: deleteSpotReservation
    method: DELETE
    path: /spot_reservations/{spot_reservation_id}
    reversal: null
    reversal_kind: none
    window: null
    window_source: null
    constraint: >-
      No restore/undelete operation exists. A deleted reservation can only be re-created with
      postSpotReservation, which produces a new spot_reservation_id.
  read_only_surface: >-
    The other ten operations (users, facilities, events, gate logs, spots, and the reservation reads) are
    GET-only and carry no reversibility obligation.
