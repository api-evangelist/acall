aid: acall
name: Acall
description: >-
  Acall Inc. (アコール株式会社) is a Japanese workplace-experience software company, founded in 2010 and
  headquartered in Tokyo with a Kobe office, whose Acall / WorkstyleOS platform runs the physical side of
  hybrid work for more than 7,000 organizations. The product is a set of check-in surfaces — Acall Reception
  (iPad visitor reception and entry/exit records), Acall Meeting (meeting-room booking and utilization),
  Acall Desktop (free-address desk and workspace "spot" reservation / hoteling), Acall Gate (entry-gate
  integration), AI Meeting, Neat device integration and a multi-tenant building mode — stitched to Microsoft
  365 and Google Calendar, Teams/Slack/Chatwork notifications, and SSO/SCIM-style provisioning. Acall
  publishes a REST "Acall Public API" (v1, bearer token) covering workers, facilities, events, gate access
  logs, spots and spot reservations, plus an outbound Webhook surface for appointment and internal-meeting
  events. API access is not self-serve: a token is issued only after a request through the contact form, and
  the API is unavailable on the multi-tenant plan.
